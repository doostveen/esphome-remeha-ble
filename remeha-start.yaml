# =====================================================================
#  Remeha via Bluetooth (built-in Bluetooth or GTW-IoT home hub)
#  START YAML: first flash. Then open http://<esp-ip>/remeha, press
#  "Scan appliance", pick what you want and flash the YAML you get there.
# ---------------------------------------------------------------------
#  Put these in the secrets.yaml of your ESPHome:
#     wifi_ssid / wifi_password
#     remeha_bt_key : the 6-digit number on the BLE sticker, in quotes ("012345").
#  The component is fetched from GitHub when compiling (no token needed).
#  Use at your own risk. Only one BLE connection at a time: to connect with the app,
#  switch off "Remeha reading" first.
# =====================================================================

substitutions:
  device_name: remeha-ble
  friendly_name: "Remeha"
  # 00:00:00:00:00:00 = find the appliance automatically (name EHC-... or GTW-IOT...).
  # With several appliances, fill in the MAC (it is in the log: "BLE gezien: ...").
  ble_mac: "00:00:00:00:00:00"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev          # change this if you use another ESP32 board
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
web_server:
  version: 3
  port: 80

external_components:
  - source: github://mcc-tweakers/esphome-remeha-ble@main
    components: [remeha_ble]
    refresh: 1d

button:
  - platform: restart
    name: "Remeha ESP restart"
    icon: mdi:restart

switch:
  - platform: template
    name: "Remeha reading"
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(remeha).set_active(true);'
    turn_off_action:
      - lambda: 'id(remeha).set_active(false);'

esp32_ble:
  io_capability: keyboard_only   # needed to pair with the sticker number

esp32_ble_tracker:

ble_client:
  - mac_address: ${ble_mac}
    id: remeha_client

remeha_ble:
  id: remeha
  ble_client_id: remeha_client
  update_interval: 30s
  service_uuid: "f8fc98e4-5919-4a5c-852e-dfe04ad383c0"
  write_uuid:   "496b1b03-cebc-4d59-9c32-14ea88c266f9"
  notify_uuid:  "ab9af948-fb86-492d-820d-bdea2dcb7ecf"
  # Built-in Bluetooth: pairs with the sticker number. GTW-IoT: no pairing, the
  # component detects that from the name (then put 000000 in remeha_bt_key).
  passkey: !secret remeha_bt_key
  write_result:
    name: "Remeha last write result"
  reconnect_reason:
    name: "Remeha last reconnect reason"
  reconnect_count:
    name: "Remeha reconnects"
  appliance:
    name: "Remeha appliance"
  # Configurator page on the ESP itself: open http://<esp-ip>/remeha,
  # press "Scan appliance" and pick what you want. Set to false to save flash.
  configurator: true

# --- A few values to start with; the configurator replaces this ---
sensor:
  - platform: remeha_ble
    code: AM016
  - platform: remeha_ble
    code: AM019
  - platform: remeha_ble
    code: AM027

text_sensor:
  - platform: remeha_ble
    code: AM012
