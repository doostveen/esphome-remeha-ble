<style>
/* Layout: one working column; numbered steps follow the real flow (flash, dump, choose, flash again). */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --fg: #16232b;
  --muted: #5b6b75;
  --line: #d6dee3;
  --accent: #0f6a8b;      /* water side of the heat pump */
  --accent-soft: #e2f0f5;
  --warm: #b4570f;        /* writable setting: changes the appliance */
  --warm-soft: #fbeee2;
  --ok: #2c7a4b;
  --code-bg: #0f1a20;
  --code-fg: #d7e6ec;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16222a; --fg: #e3ecf0; --muted: #93a6b0; --line: #2a3a44;
    --accent: #4fb3d6; --accent-soft: #15333f; --warm: #f0a35e; --warm-soft: #3a2614; --ok: #6ccf93;
    --code-bg: #0a1115; --code-fg: #d7e6ec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16222a; --fg: #e3ecf0; --muted: #93a6b0; --line: #2a3a44;
  --accent: #4fb3d6; --accent-soft: #15333f; --warm: #f0a35e; --warm-soft: #3a2614; --ok: #6ccf93;
  --code-bg: #0a1115; --code-fg: #d7e6ec; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--font-head); font-size: 1.9rem; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-head); font-size: 1.15rem; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h2 .n { font-family: var(--font-mono); font-size: .85rem; color: var(--accent); font-weight: 500; }
.lead { color: var(--muted); max-width: 70ch; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: grid; gap: 4px; }
input[type=text], select, textarea {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; text-transform: none; letter-spacing: 0;
}
textarea { font-family: var(--font-mono); font-size: .8rem; min-height: 120px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; font-weight: 500; border-radius: 6px; padding: 7px 13px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
button.ghost { background: transparent; color: var(--accent); }
button.chip { border-color: var(--line); background: var(--bg); color: var(--fg); padding: 4px 11px; border-radius: 999px; font-size: .85rem; }
button.chip:hover { border-color: var(--accent); }
.status { font-size: .9rem; color: var(--muted); }
.status b { color: var(--fg); font-weight: 600; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.warm { background: var(--warm-soft); color: var(--warm); }
.badge.example { background: var(--warm-soft); color: var(--warm); }
.toolbar { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .toolbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .toolbar .search { grid-column: 1 / -1; } }
.tablebox { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; z-index: 1; }
td.code { font-family: var(--font-mono); white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
td.name { min-width: 16ch; }
tr.on-r td { background: var(--accent-soft); }
tr.on-w td { background: var(--warm-soft); }
td.chk, th.chk { text-align: center; width: 1%; white-space: nowrap; }
td.chk input { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--accent); }
td.chk input.warm { accent-color: var(--warm); }
.counts { font-family: var(--font-mono); font-size: .85rem; }
pre.yaml { margin: 0; background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono); font-size: .78rem; line-height: 1.45; padding: 14px; border-radius: 6px; overflow: auto; max-height: 70vh; white-space: pre; }
.check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font-size: .9rem; color: var(--fg); }
.privacy { border-left: 3px solid var(--ok); padding-left: 10px; }
.topline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.langs { display: flex; gap: 6px; }
.langs .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--surface); }
button.xp { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 6px; margin-right: 6px; font-size: .75rem; line-height: 1.4; border-radius: 4px; font-family: var(--font-mono); }
button.xp:hover { border-color: var(--accent); }
.cnt { color: var(--muted); font-size: .78rem; margin-left: 4px; }
tr.sub td.code { padding-left: 34px; color: var(--muted); }
tr.sub td.name { color: var(--muted); }
tr.parent td { border-bottom-style: dashed; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="topline">
      <h1>Remeha BLE Configurator</h1>
      <div class="langs" role="group" aria-label="Taal / Language / Sprache">
        <button type="button" class="chip" data-lang="nl">NL</button>
        <button type="button" class="chip" data-lang="en">EN</button>
        <button type="button" class="chip" data-lang="de">DE</button>
      </div>
    </div>
    <p class="lead" data-i18n-html="lead"></p>
  </header>

  <div class="cols">
    <section class="panel" aria-labelledby="h-dump">
      <h2 id="h-dump"><span class="n">1</span><span data-i18n="h1"></span></h2>

        <p class="note" data-i18n-html="scanNote"></p>
        <div class="row">
          <button id="btn-scan" type="button" data-i18n="scanBtn"></button>
        </div>
      </div>
      <p class="note file-only" data-i18n-html="dumpNote"></p>
      <textarea class="file-only" id="dump" placeholder="[09:21:14][I][remeha_confida:1093]: DUMP n1 0x502B:01 len=1474 @0 6200020000011130..." data-i18n-aria="dumpAria"></textarea>
      <div class="row file-only">
        <button id="btn-parse" type="button" data-i18n="parseBtn"></button>
        <button id="btn-sample" type="button" class="ghost" data-i18n="sampleBtn"></button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <p class="note privacy file-only" data-i18n="privacy"></p>
    </section>

    <section class="panel" aria-labelledby="h-set">
      <h2 id="h-set"><span class="n">2</span><span data-i18n="h2"></span></h2>
      <div class="form">
        <label><span data-i18n="lRoute"></span>
          <select id="route">
            <option value="gtw22" data-i18n="oGtw22"></option>
            <option value="gtwiot" data-i18n="oGtwiot"></option>
          </select>
        </label>
        <label><span data-i18n="lDev"></span>
          <input id="devname" type="text" value="remeha-ble" spellcheck="false">
        </label>
        <label><span data-i18n="lFriendly"></span>
          <input id="friendly" type="text" value="Remeha">
        </label>
        <label><span data-i18n="lMac"></span>
          <input id="mac" type="text" value="00:00:00:00:00:00" spellcheck="false">
        </label>
        <label><span data-i18n="lRef"></span>
          <select id="ref">
            <option value="main" data-i18n="oMain"></option>
            <option value="dev" data-i18n="oDev"></option>
          </select>
        </label>
      </div>
      <label class="check"><input id="expected" type="checkbox" checked> <span data-i18n="expected"></span></label>
      <p class="note" data-i18n-html="secretsNote"></p>
    </section>
  </div>

  <section class="panel" aria-labelledby="h-pick">
    <h2 id="h-pick"><span class="n">3</span><span data-i18n="h3"></span></h2>
    <div class="row">
      <span class="note" data-i18n="quick"></span>
      <span id="presets" class="row"></span>
      <button id="btn-clear" type="button" class="chip" data-i18n="clear"></button>
    </div>
    <div class="toolbar">
      <label class="search"><span data-i18n="lSearch"></span>
        <input id="q" type="text" data-i18n-ph="phSearch">
      </label>
      <label><span data-i18n="lGroup"></span>
        <select id="f-group"></select>
      </label>
      <label><span data-i18n="lKind"></span>
        <select id="f-kind">
          <option value="" data-i18n="all"></option>
          <option value="S" data-i18n="kS"></option>
          <option value="P" data-i18n="kP"></option>
          <option value="C" data-i18n="kC"></option>
        </select>
      </label>
      <label><span data-i18n="lShow"></span>
        <select id="f-show">
          <option value="all" data-i18n="sAll"></option>
          <option value="sel" data-i18n="sSel"></option>
          <option value="lvl1" data-i18n="sLvl1"></option>
        </select>
      </label>
    </div>
    <div class="row">
      <span class="counts" id="counts"></span>
      <span class="note" data-i18n-html="legend"></span>
    </div>
    <div class="tablebox">
      <table>
        <thead><tr><th class="chk" data-i18n="thRead"></th><th class="chk" data-i18n="thWrite"></th><th data-i18n="thCode"></th><th data-i18n="thName"></th><th data-i18n="thKind"></th><th data-i18n="thRange"></th><th data-i18n="thLevel"></th><th data-i18n="thNode"></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-yaml">
    <h2 id="h-yaml"><span class="n">4</span><span data-i18n="h4"></span></h2>
    <div class="row">
      <button id="btn-copy" type="button" data-i18n="copy"></button>
      <button id="btn-dl" type="button" class="ghost" data-i18n="download"></button>
      <span id="copied" class="status" aria-live="polite"></span>
    </div>
    <p class="note" data-i18n="yamlNote"></p>
    <pre class="yaml" id="yaml"></pre>
  </section>
</div>

      }
      if (texts) {
        L.push("    options:");
        for (const [v, s] of enumOptions(o)) L.push("      " + v + ": " + yq(s));
      }
    }
    (byPlat[plat] = byPlat[plat] || []).push(L.join("\n"));
  }
  let body = "";
  for (const p of order) {
    if (!byPlat[p]) continue;
    body += "\n" + p + ":\n" + byPlat[p].join("\n") + "\n";
  }
  if (!body) body = "\n" + t("yNone") + "\n";
  return head + body;
}
function renderYaml() {
  const route = $("route").value;
  $("yaml").textContent = buildYaml();
  store("settings", { route, devname: $("devname").value, friendly: $("friendly").value, mac: $("mac").value, ref: $("ref").value, expected: $("expected").checked });
}

// ---- language switch ----
function applyLang() {
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = t(el.dataset.i18nPh);
  for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));
  const P = t("presets");
  $("presets").innerHTML = Object.keys(DATA.presets).map((p) => '<button type="button" class="chip" data-p="' + p + '">' + (P[p] || p) + "</button>").join("");
}
document.querySelector(".langs").addEventListener("click", (e) => {
  const l = e.target.dataset.lang; if (!l || l === LANG) return;
  LANG = l; store("lang", l);
  applyLang(); buildGroupFilter();
  if (rows.length || !ON_DEVICE) showDeviceStatus();
  render();
});

// ---- events ----
$("tbody").addEventListener("click", (e) => {
  const x = e.target.closest("[data-x]"); if (!x) return;
  const gk = x.dataset.x;
  if (expanded.has(gk)) expanded.delete(gk); else expanded.add(gk);
  render();
});
$("tbody").addEventListener("change", (e) => {
  const m = e.target.dataset.m, on = e.target.checked;
  if (!m) return;
  if (e.target.dataset.g) {
    // parent of an array: (un)tick all elements at once
    const g = groups.find((x) => x.gk === e.target.dataset.g); if (!g) return;
    for (const r of g.rows) {
      if (m === "r") { if (on) { if (!sel[r.key]) sel[r.key] = "r"; } else delete sel[r.key]; }
      else if (writable(r.o)) { if (on) sel[r.key] = "w"; else if (sel[r.key] === "w") sel[r.key] = "r"; }
    }
    store("sel", sel);
    render();
    return;
  }
  const k = e.target.dataset.k; if (!k) return;
  // instelbaar implies lezen; unticking lezen also drops instelbaar
  const v = m === "w" ? (on ? "w" : "r") : (on ? "r" : "");
  if (v) sel[k] = v; else delete sel[k];
  store("sel", sel);
  if (e.target.closest("tr").classList.contains("sub")) { render(); return; }  // parent state changes too
  const tr = e.target.closest("tr");
  for (const cb of tr.querySelectorAll("input[data-m]")) cb.checked = cb.dataset.m === "r" ? !!v : v === "w";
  tr.className = v ? "on-" + v : "";
  updateCounts();
  renderYaml();
});
for (const id of ["q", "f-group", "f-kind", "f-show"]) $(id).addEventListener("input", render);
for (const id of ["route", "devname", "friendly", "mac", "ref", "expected"]) $(id).addEventListener("input", renderYaml);
$("btn-parse").addEventListener("click", () => {
  const d = parseDump($("dump").value);
  if (!d.recs.length) { $("status").innerHTML = t("noMenu"); return; }
  sel = {};
  setRecords(d.recs, { article: d.article, name: d.name, example: false });
  store("dump", d);
  applyPreset("basis");
});
$("btn-sample").addEventListener("click", () => {
  sel = {};
  setRecords(DATA.sample, { article: 7887477, name: "IDU2WH", example: true });
  applyPreset("basis");
});
$("btn-clear").addEventListener("click", () => { sel = {}; store("sel", sel); render(); });
$("btn-copy").addEventListener("click", async () => {
  const txt = $("yaml").textContent;
  try { await navigator.clipboard.writeText(txt); $("copied").textContent = t("copied"); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($("yaml"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $("copied").textContent = t("selected");
  }
  setTimeout(() => ($("copied").textContent = ""), 3500);
});
$("btn-dl").addEventListener("click", () => {
  const blob = new Blob([$("yaml").textContent], { type: "text/yaml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (($("devname").value || "remeha-ble").trim() || "remeha-ble") + ".yaml";
  document.body.appendChild(a); a.click(); a.remove();
});

// ---- configurator on the ESP itself (/remeha) ----
const ON_DEVICE = !!DATA.onDevice;
let pollTimer = null;
function applyDeviceResult(j) {
  if (j.route && !load("settings", null)) $("route").value = j.route;
  setRecords(j.recs || [], { article: j.article || 0, name: j.name || "", example: false });
  const saved = load("sel", null) || {};
  const valid = new Set(rows.map((r) => r.key));
  sel = {};
  for (const [k, v] of Object.entries(saved)) if (valid.has(k)) sel[k] = v;
  if (Object.keys(sel).length) render(); else applyPreset("basis");
}
function espMsg(m) {  // the ESP reports in Dutch; translate the known messages
  return m === I18N.nl.errMem ? t("errMem") : m === I18N.nl.errPage ? t("errPage") : (m || t("unknownErr"));
}
// The ESP streams the scan: every poll returns the new menu blocks and frees the
// ones the page already has (gen/from), so the ESP never holds the whole result.
let scan = { gen: -1, from: 0, recs: [] };
async function pollScan(first) {
  try {
    const q = "?gen=" + scan.gen + "&from=" + scan.from + "&t=" + Date.now();
    const r = await fetch("/remeha/data.json" + q, { cache: "no-store" });
    const j = await r.json();
    if (j.gen !== scan.gen) scan = { gen: j.gen, from: 0, recs: [] };  // new run: start over
    if (j.recs && j.recs.length) scan.recs.push(...j.recs);
    if (typeof j.next === "number") scan.from = j.next;
    if (j.state === "done") {
      clearTimeout(pollTimer); pollTimer = null;
      $("btn-scan").disabled = false;
      if (first) {  // finished before this page was opened: the blocks are gone
        restoreDeviceScan();
        return;
      }
      fetch("/remeha/data.json?gen=" + scan.gen + "&from=" + scan.from, { cache: "no-store" }).catch(() => {});
      const res = { recs: scan.recs, article: j.article || 0, name: j.name || "", route: j.route };
      store("devscan", res);
      applyDeviceResult(res);
      return;
    }
    if (j.state === "error") {
      clearTimeout(pollTimer); pollTimer = null;
      $("status").innerHTML = "<b>" + t("aborted") + "</b> " + esc(espMsg(j.msg)) + ". " + t("retry");
      $("btn-scan").disabled = false;
      return;
    }
    if (j.state === "waiting" || j.state === "scanning") {
      if (first && j.state === "scanning") {  // earlier blocks went to another page: start over
        try { await fetch("/remeha/scan", { cache: "no-store" }); } catch (e) {}
      }
      $("btn-scan").disabled = true;
      $("status").innerHTML = "<b>" + t("scanning") + "</b> " + (j.total ? t("progress", j.progress, j.total) : t("waitLink"));
      pollTimer = setTimeout(() => pollScan(false), 400);
    } else if (first) {
      restoreDeviceScan();
    }
  } catch (e) {
    $("status").innerHTML = t("noAnswer");
    $("btn-scan").disabled = false;
  }
}
function restoreDeviceScan() {
  const d = load("devscan", null);
  if (d && d.recs && d.recs.length) applyDeviceResult(d);
  else $("status").innerHTML = t("notScanned");
}
if (ON_DEVICE) {
  for (const el of document.querySelectorAll(".file-only")) el.hidden = true;
  for (const el of document.querySelectorAll(".on-device")) el.hidden = false;
  $("btn-scan").addEventListener("click", async () => {
    $("btn-scan").disabled = true;
    $("status").innerHTML = "<b>" + t("scanning") + "</b>";
    try { await fetch("/remeha/scan", { cache: "no-store" }); } catch (e) {}
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => pollScan(false), 500);
  });
}

// ---- start ----
(function init() {
  applyLang();
  $("presets").addEventListener("click", (e) => { const p = e.target.dataset.p; if (p) applyPreset(p); });
  const s = load("settings", null);
  if (s) { for (const k of ["route", "devname", "friendly", "mac", "ref"]) if (s[k] !== undefined) $(k).value = s[k]; $("expected").checked = s.expected !== false; }
  const d = load("dump", null);
  const savedSel = load("sel", null);
  if (ON_DEVICE) { rows = []; setRecords([], { article: 0, name: "", example: false }); pollScan(true); }
  else if (d && d.recs && d.recs.length) setRecords(d.recs, { article: d.article, name: d.name, example: false });
  else setRecords(DATA.sample, { article: 7887477, name: "IDU2WH", example: true });
  if (savedSel && Object.keys(savedSel).length) { sel = savedSel; const valid = new Set(rows.map((r) => r.key)); for (const k of Object.keys(sel)) if (!valid.has(k)) delete sel[k]; render(); }
  else applyPreset("basis");
})();
</script>
