<style>
/* Layout: one working column; numbered steps follow the real flow (flash, dump, choose, flash again). */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --fg: #16232b;
  --muted: #5b6b75;
  --line: #d6dee3;
  --accent: #0f6a8b;      /* water side of the heat pump */
  --accent-soft: #e2f0f5;
  --warm: #b4570f;        /* writable setting: changes the appliance */
  --warm-soft: #fbeee2;
  --ok: #2c7a4b;
  --code-bg: #0f1a20;
  --code-fg: #d7e6ec;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16222a; --fg: #e3ecf0; --muted: #93a6b0; --line: #2a3a44;
    --accent: #4fb3d6; --accent-soft: #15333f; --warm: #f0a35e; --warm-soft: #3a2614; --ok: #6ccf93;
    --code-bg: #0a1115; --code-fg: #d7e6ec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16222a; --fg: #e3ecf0; --muted: #93a6b0; --line: #2a3a44;
  --accent: #4fb3d6; --accent-soft: #15333f; --warm: #f0a35e; --warm-soft: #3a2614; --ok: #6ccf93;
  --code-bg: #0a1115; --code-fg: #d7e6ec; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--font-head); font-size: 1.9rem; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-head); font-size: 1.15rem; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h2 .n { font-family: var(--font-mono); font-size: .85rem; color: var(--accent); font-weight: 500; }
.lead { color: var(--muted); max-width: 70ch; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: grid; gap: 4px; }
input[type=text], select, textarea {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; text-transform: none; letter-spacing: 0;
}
textarea { font-family: var(--font-mono); font-size: .8rem; min-height: 120px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; font-weight: 500; border-radius: 6px; padding: 7px 13px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
button.ghost { background: transparent; color: var(--accent); }
button.chip { border-color: var(--line); background: var(--bg); color: var(--fg); padding: 4px 11px; border-radius: 999px; font-size: .85rem; }
button.chip:hover { border-color: var(--accent); }
.status { font-size: .9rem; color: var(--muted); }
.status b { color: var(--fg); font-weight: 600; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.warm { background: var(--warm-soft); color: var(--warm); }
.toolbar { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .toolbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .toolbar .search { grid-column: 1 / -1; } }
.tablebox { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; z-index: 1; }
td.code { font-family: var(--font-mono); white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
td.name { min-width: 16ch; }
tr.on-r td { background: var(--accent-soft); }
tr.on-w td { background: var(--warm-soft); }
td.chk, th.chk { text-align: center; width: 1%; white-space: nowrap; }
td.chk input { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--accent); }
td.chk input.warm { accent-color: var(--warm); }
td.val { white-space: nowrap; }
button.rd { border: 1px solid var(--line); background: var(--bg); color: var(--accent); padding: 0 8px; font-size: .78rem; line-height: 1.5; border-radius: 4px; font-weight: 500; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
button.rd:hover { border-color: var(--accent); }
.counts { font-family: var(--font-mono); font-size: .85rem; }
pre.yaml { margin: 0; background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono); font-size: .78rem; line-height: 1.45; padding: 14px; border-radius: 6px; overflow: auto; max-height: 70vh; white-space: pre; }
.check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font-size: .9rem; color: var(--fg); }
.imports { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.topline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.langs { display: flex; gap: 6px; }
.langs .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--surface); }
button.xp { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 6px; margin-right: 6px; font-size: .75rem; line-height: 1.4; border-radius: 4px; font-family: var(--font-mono); }
button.xp:hover { border-color: var(--accent); }
.cnt { color: var(--muted); font-size: .78rem; margin-left: 4px; }
tr.sub td.code { padding-left: 34px; color: var(--muted); }
tr.sub td.name { color: var(--muted); }
tr.parent td { border-bottom-style: dashed; }
.outside { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
progress { width: 100%; max-width: 420px; height: 8px; accent-color: var(--accent); }
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); padding: 18px; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(10, 20, 26, .45); }
dialog .dlg { display: grid; gap: 12px; }
dialog .dlg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
dialog h3 { font-family: var(--font-head); font-size: 1.1rem; margin: 0; }
dialog .form { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 640px) { dialog .form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } dialog .form .search { grid-column: 1 / -1; } }
dialog .tablebox { max-height: 50vh; }
.alias { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }
button.sm { padding: 2px 10px; font-size: .82rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<div class="wrap">
  <header>
    <div class="topline">
      <h1>Remeha BLE Configurator</h1>
      <div class="langs" role="group" aria-label="Taal / Language / Sprache">
        <button type="button" class="chip" data-lang="nl">NL</button>
        <button type="button" class="chip" data-lang="en">EN</button>
        <button type="button" class="chip" data-lang="de">DE</button>
      </div>
    </div>
    <p class="lead" data-i18n-html="lead"></p>
  </header>

  <div class="cols">
    <section class="panel" aria-labelledby="h-dump">
      <h2 id="h-dump"><span class="n">1</span><span data-i18n="h1"></span></h2>
      <p class="note" data-i18n-html="scanNote"></p>
      <div class="row">
        <button id="btn-scan" type="button" data-i18n="scanBtn"></button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="imports">
        <p class="note" data-i18n="importIntro"></p>
        <div class="row">
          <button id="btn-esp" type="button" class="ghost" data-i18n="btnEsp"></button>
          <button id="btn-yaml" type="button" class="ghost" data-i18n="btnYaml" aria-expanded="false" aria-controls="yamlin-box"></button>
        </div>
        <div id="yamlin-box" hidden>
          <textarea id="yamlin" data-i18n-ph="yamlPh" data-i18n-aria="yamlPh" spellcheck="false"></textarea>
          <div class="row"><button id="btn-import" type="button" data-i18n="btnImport"></button></div>
          <p class="note" data-i18n="importNote"></p>
        </div>
        <div id="import-status" class="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-set">
      <h2 id="h-set"><span class="n">2</span><span data-i18n="h2"></span></h2>
      <div class="form">
        <label><span data-i18n="lDev"></span>
          <input id="devname" type="text" value="remeha-ble" spellcheck="false">
        </label>
        <label><span data-i18n="lFriendly"></span>
          <input id="friendly" type="text" value="Remeha">
        </label>
        <label><span data-i18n="lMac"></span>
          <input id="mac" type="text" value="00:00:00:00:00:00" spellcheck="false">
        </label>
        <label><span data-i18n="lRef"></span>
          <select id="ref">
            <option value="main" data-i18n="oMain"></option>
            <option value="dev" data-i18n="oDev"></option>
          </select>
        </label>
      </div>
      <label class="check"><input id="expected" type="checkbox" checked> <span data-i18n="expected"></span></label>
      <p class="note" data-i18n="expectedNote"></p>
      <p class="note" data-i18n-html="secretsNote"></p>
    </section>
  </div>

  <section class="panel" aria-labelledby="h-pick">
    <h2 id="h-pick"><span class="n">3</span><span data-i18n="h3"></span></h2>
    <div class="row">
      <span class="note" data-i18n="quick"></span>
      <span id="presets" class="row"></span>
      <button id="btn-clear" type="button" class="chip" data-i18n="clear"></button>
    </div>
    <div class="outside">
      <p class="note" data-i18n="outsideNote"></p>
      <div class="row">
        <button id="btn-cb" type="button" class="ghost" data-i18n="cbBtn"></button>
        <button id="btn-deep" type="button" class="ghost" data-i18n="deepBtn"></button>
        <label class="check" id="deep-node-box" hidden><input id="deep-node" type="checkbox"> <span data-i18n="deepNode"></span></label>
        <button id="btn-deep-stop" type="button" class="chip" data-i18n="deepStop" hidden></button>
      </div>
      <progress id="deep-bar" max="1" value="0" hidden></progress>
      <div id="deep-status" class="status" aria-live="polite"></div>
    </div>
    <div class="toolbar">
      <label class="search"><span data-i18n="lSearch"></span>
        <input id="q" type="text" data-i18n-ph="phSearch">
      </label>
      <label><span data-i18n="lGroup"></span>
        <select id="f-group"></select>
      </label>
      <label><span data-i18n="lKind"></span>
        <select id="f-kind">
          <option value="" data-i18n="all"></option>
          <option value="S" data-i18n="kS"></option>
          <option value="P" data-i18n="kP"></option>
          <option value="C" data-i18n="kC"></option>
        </select>
      </label>
      <label><span data-i18n="lShow"></span>
        <select id="f-show">
          <option value="all" data-i18n="sAll"></option>
          <option value="sel" data-i18n="sSel"></option>
          <option value="lvl1" data-i18n="sLvl1"></option>
          <option value="extra" data-i18n="sExtra"></option>
        </select>
      </label>
    </div>
    <div class="row">
      <span class="counts" id="counts"></span>
      <span class="note" data-i18n-html="legend"></span>
    </div>
    <div class="tablebox">
      <table>
        <thead><tr><th class="chk" data-i18n="thRead"></th><th class="chk" data-i18n="thWrite"></th><th data-i18n="thCode"></th><th data-i18n="thName"></th><th data-i18n="thKind"></th><th data-i18n="thRange"></th><th data-i18n="thValue"></th><th data-i18n="thLevel"></th><th data-i18n="thNode"></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-yaml">
    <h2 id="h-yaml"><span class="n">4</span><span data-i18n="h4"></span></h2>
    <div class="row">
      <button id="btn-copy" type="button" data-i18n="copy"></button>
      <button id="btn-dl" type="button" class="ghost" data-i18n="download"></button>
      <span id="copied" class="status" aria-live="polite"></span>
    </div>
    <p class="note" data-i18n="yamlNote"></p>
    <pre class="yaml" id="yaml"></pre>
  </section>
</div>

<dialog id="cb-dlg" aria-labelledby="cb-title">
  <div class="dlg">
    <div class="dlg-head">
      <h3 id="cb-title" data-i18n="cbTitle"></h3>
      <button id="cb-close" type="button" class="chip" data-i18n="cbClose"></button>
    </div>
    <div class="form">
      <label class="search"><span data-i18n="cbSearch"></span>
        <input id="cb-q" type="text" data-i18n-ph="cbPh" spellcheck="false" autocomplete="off">
      </label>
      <label><span data-i18n="cbNode"></span>
        <select id="cb-node"></select>
      </label>
      <label><span data-i18n="cbEl"></span>
        <input id="cb-el" type="text" inputmode="numeric" value="1">
      </label>
    </div>
    <p class="note" data-i18n="cbNote"></p>
    <div id="cb-alias" class="alias" hidden></div>
    <div id="cb-msg" class="status" aria-live="polite"></div>
    <div class="tablebox">
      <table>
        <thead><tr><th data-i18n="thCode"></th><th data-i18n="thName"></th><th data-i18n="thKind"></th><th data-i18n="thValue"></th><th></th></tr></thead>
        <tbody id="cb-body"></tbody>
      </table>
    </div>
  </div>
</dialog>

  const box = $("yamlin-box"), open = box.hidden;
  box.hidden = !open;
  $("btn-yaml").setAttribute("aria-expanded", String(open));
  if (open) $("yamlin").focus();

$("btn-import").addEventListener("click", () => importYaml($("yamlin").value));
function espMsg(m) {  // the ESP reports in Dutch; translate the known messages
  return m === I18N.nl.errMem ? t("errMem") : m === I18N.nl.errPage ? t("errPage") : (m || t("unknownErr"));
}
// The ESP streams the scan: every poll returns the new menu blocks and frees the
// ones the page already has (gen/from), so the ESP never holds the whole result.
let scan = { gen: -1, from: 0, recs: [] };
async function pollScan(first) {
  try {
    const q = "?gen=" + scan.gen + "&from=" + scan.from + "&t=" + Date.now();
    const r = await fetch("/remeha/data.json" + q, { cache: "no-store" });
    const j = await r.json();
    if (j.gen !== scan.gen) scan = { gen: j.gen, from: 0, recs: [] };  // new run: start over
    if (j.recs && j.recs.length) scan.recs.push(...j.recs);
    if (typeof j.next === "number") scan.from = j.next;
    if (j.state === "done") {
      clearTimeout(pollTimer); pollTimer = null;
      $("btn-scan").disabled = false;
      if (first) {  // finished before this page was opened: the blocks are gone
        restoreDeviceScan();
        return;
      }
      fetch("/remeha/data.json?gen=" + scan.gen + "&from=" + scan.from, { cache: "no-store" }).catch(() => {});
      const res = { recs: scan.recs, article: j.article || 0, name: j.name || "" };
      store("devscan", res);
      applyDeviceResult(res);
      return;
    }
    if (j.state === "error") {
      clearTimeout(pollTimer); pollTimer = null;
      $("status").innerHTML = "<b>" + t("aborted") + "</b> " + esc(espMsg(j.msg)) + ". " + t("retry");
      $("btn-scan").disabled = false;
      return;
    }
    if (j.state === "waiting" || j.state === "scanning") {
      if (first && j.state === "scanning") {  // earlier blocks went to another page: start over
        try { await fetch("/remeha/scan", { cache: "no-store" }); } catch (e) {}
      }
      $("btn-scan").disabled = true;
      $("status").innerHTML = "<b>" + t("scanning") + "</b> " + (j.total ? t("progress", j.progress, j.total) : t("waitLink"));
      pollTimer = setTimeout(() => pollScan(false), 400);
    } else if (first) {
      restoreDeviceScan();
    }
  } catch (e) {
    $("status").innerHTML = t("noAnswer");
    $("btn-scan").disabled = false;
  }
}
function restoreDeviceScan() {
  const d = load("devscan", null);
  if (d && d.recs && d.recs.length) applyDeviceResult(d);
  else $("status").innerHTML = t("notScanned");
}
$("btn-scan").addEventListener("click", async () => {
  $("btn-scan").disabled = true;
  $("status").innerHTML = "<b>" + t("scanning") + "</b>";
  try { await fetch("/remeha/scan", { cache: "no-store" }); } catch (e) {}
  clearTimeout(pollTimer);
  pollTimer = setTimeout(() => pollScan(false), 500);
});

// ---- objects outside the menu: add one from the codebook ----
const codeKey = new Map();  // app code -> codebook key "IIII:SS"
for (const [k, o] of Object.entries(DATA.objects)) if (o.c && !o.d && !codeKey.has(o.c)) codeKey.set(o.c, k);
function scanNodes() {
  const ns = [...new Set(lastRecs.map((r) => r[0]))].sort((a, b) => a - b);
  return ns.length ? ns : [1];
}
function keyOf(k) { return { idx: parseInt(k.slice(0, 4), 16), sub: parseInt(k.slice(5), 16) }; }
// The Remeha app gives each element of an array its own code: AC089 is AC088
// element 2, CP081..CP085 are CP080 activity 2..6. Find that base code.
function appAlias(q) {
  const m = q.toUpperCase().match(/^([A-Z]{2})(\d{3})$/);
  if (!m || codeKey.has(q.toUpperCase())) return null;
  const n = +m[2];
  for (let d = 1; d <= 15 && n - d >= 0; d++) {
    const base = m[1] + String(n - d).padStart(3, "0"), k = codeKey.get(base);
    if (k && DATA.objects[k].a) return { code: q.toUpperCase(), base, k, el: d + 1 };
    if (k) return null;
  }
  return null;
}
let cbList = [];
function cbSearch() {
  const q = $("cb-q").value.trim(), ql = q.toLowerCase();
  const hx = ql.replace(/^0x/, "");
  const node = +$("cb-node").value || 1;
  const alias = q ? appAlias(q) : null;
  const ab = $("cb-alias");
  if (alias) {
    ab.hidden = false;
    ab.innerHTML = "<span>" + esc(t("cbAlias", alias.code, alias.el, alias.base)) + '</span><button type="button" class="sm" data-alias="1">' +
      esc(t("cbAliasAdd", alias.base, alias.el)) + "</button>";
    ab.dataset.k = alias.k; ab.dataset.el = alias.el;
  } else ab.hidden = true;
  if (!q) { cbList = []; $("cb-body").innerHTML = ""; $("cb-msg").textContent = ""; return; }
  const hits = [];
  for (const [k, o] of Object.entries(DATA.objects)) {
    if (!readable(o)) continue;
    if (o.a && k.slice(5) !== "00") continue;  // one row per array object
    if ((o.c || "").toLowerCase().includes(ql) || nm(o).toLowerCase().includes(ql) || o.n.toLowerCase().includes(ql) ||
        (/^[0-9a-f]{3,4}$/.test(hx) && k.toLowerCase().startsWith(hx.padStart(4, "0")))) hits.push(k);
  }
  hits.sort((a, b) => {
    const A = DATA.objects[a], B = DATA.objects[b];
    return (A.c ? 0 : 1) - (B.c ? 0 : 1) || (A.c || a).localeCompare(B.c || b);
  });
  cbList = hits.slice(0, 50);
  $("cb-msg").textContent = hits.length > 50 ? t("cbMore", hits.length) : hits.length ? "" : t("cbNone");
  const have = new Set(rows.map((r) => r.key));
  $("cb-body").innerHTML = cbList.map((k) => {
    const o = DATA.objects[k], { idx, sub } = keyOf(k);
    const s2 = o.a ? cbElement() : sub, rk = node + "-" + hex4(idx) + "-" + s2, inList = have.has(rk);
    return '<tr><td class="code">' + esc(o.c || "0x" + hex4(idx)) + (o.a ? '<span class="cnt">:' + s2 + "</span>" : sub ? '<span class="cnt">:' + sub + "</span>" : "") +
      '</td><td class="name">' + esc(nm(o)) + "</td><td>" + t({ P: "kindP", S: "kindS", C: "kindC" }[o.k]) +
      '</td><td class="val"><button type="button" class="rd" data-cbr="' + k + '">' + esc(probe[rk] === undefined ? t("readBtn") : probe[rk]) +
      '</button></td><td>' + (inList ? '<span class="note">' + t("cbInList") + "</span>"
        : '<button type="button" class="sm ghost" data-cba="' + k + '">' + t("cbAdd") + "</button>") + "</td></tr>";
  }).join("");
}
function cbElement() { const v = parseInt($("cb-el").value, 10); return v >= 1 && v <= 255 ? v : 1; }
function cbTarget(k, el) {
  const o = DATA.objects[k], { idx, sub } = keyOf(k);
  return { node: +$("cb-node").value || 1, idx, sub: o.a ? (el || cbElement()) : sub, o };
}
function cbAdd(k, el) {
  if (!lastRecs.length) { $("cb-msg").textContent = t("cbScanFirst"); return; }
  const x = cbTarget(k, el);
  addExtras([[x.node, x.idx, x.sub]]);
  cbSearch();
  $("cb-msg").textContent = (x.o.c || "0x" + hex4(x.idx)) + (x.o.a ? ":" + x.sub : "") + " " + t("cbAdded");
}
function openCb() {
  $("cb-node").innerHTML = scanNodes().map((n) => '<option value="' + n + '">' + esc(nodeLabel(n)) + "</option>").join("");
  const d = $("cb-dlg");
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  $("cb-q").focus();
  cbSearch();
}
$("btn-cb").addEventListener("click", openCb);
$("cb-close").addEventListener("click", () => $("cb-dlg").close());
for (const id of ["cb-q", "cb-node", "cb-el"]) $(id).addEventListener("input", cbSearch);
$("cb-dlg").addEventListener("click", (e) => {
  const rd = e.target.closest("[data-cbr]");
  if (rd) {
    const x = cbTarget(rd.dataset.cbr), rk = x.node + "-" + hex4(x.idx) + "-" + x.sub;
    rd.textContent = "…";
    readObj(x.node, x.idx, x.sub, x.o).then((txt) => { probe[rk] = txt; rd.textContent = txt; showProbe(rk, txt); });
    return;
  }
  const ad = e.target.closest("[data-cba]");
  if (ad) { cbAdd(ad.dataset.cba); return; }
  if (e.target.closest("[data-alias]")) { const ab = $("cb-alias"); cbAdd(ab.dataset.k, +ab.dataset.el); }
});

// ---- objects outside the menu: let the ESP search the codebook ----
// Step 1 asks for 32 objects at a time in one bulk GetList (/remeha/batch?m=g):
// that returns every live value the appliance has. Settings are often not
// returned by a GetList, so step 2 reads the remaining settings one by one (m=r).
const BATCH = 32;
let deepRun = null;
function deepCandidates(nodes) {
  const inMenu = new Set(rows.filter((r) => !r.extra).map((r) => r.node + "-" + r.idx));
  const have = new Set(rows.map((r) => r.key));
  const seen = new Set(), out = [];
  for (const [k, o] of Object.entries(DATA.objects)) {
    if (!readable(o)) continue;
    const { idx, sub: s0 } = keyOf(k), sub = o.a ? 1 : s0;
    if (idx < 0x2000) continue;  // CANopen communication objects
    for (const node of nodes) {
      const key = node + "-" + hex4(idx) + "-" + sub;
      if (seen.has(key) || have.has(key) || inMenu.has(node + "-" + idx)) continue;
      seen.add(key);
      out.push({ node, idx, sub, o, key });
    }
  }
  return out;
}
async function batchRead(mode, list, onProgress) {
  const l = list.map((x) => hex2(x.node) + hex4(x.idx) + hex2(x.sub)).join(",");
  const q = await (await fetch("/remeha/batch?m=" + mode + "&l=" + l, { cache: "no-store" })).json();
  const limit = Date.now() + (mode === "g" ? 15000 : 8000 + list.length * 5000);
  while (Date.now() < limit) {
    await sleep(mode === "g" ? 200 : 350);
    if (deepRun && deepRun.stop) throw new Error("stop");
    const j = await (await fetch("/remeha/batch?t=" + Date.now(), { cache: "no-store" })).json();
    if (j.id !== q.id) continue;
    if (j.state !== "done") { if (onProgress && typeof j.done === "number") onProgress(j.done); continue; }
    if (j.err) throw new Error(j.err);
    return j.r || [];
  }
  throw new Error("timeout");
}
function deepUi(on) {
  $("btn-deep").disabled = on; $("btn-cb").disabled = on; $("btn-scan").disabled = on;
  $("btn-deep-stop").hidden = !on; $("deep-bar").hidden = !on;
  $("deep-node-box").hidden = on || !scanNodes().includes(4);
}
function deepMsg(key, ...a) { $("deep-status").innerHTML = esc(t(key, ...a)); }
async function deepScan() {
  if (!lastRecs.length) { deepMsg("cbScanFirst"); return; }
  const nodes = $("deep-node").checked ? scanNodes() : [scanNodes()[0]];
  const cand = deepCandidates(nodes);
  if (!cand.length) { deepMsg("deepNothing"); return; }
  deepRun = { stop: false };
  deepUi(true);
  const found = [], params = [];
  const bar = $("deep-bar");
  const keep = (x, st, hex) => {
    if (st !== 1) return false;
    found.push([x.node, x.idx, x.sub]);
    probe[x.key] = decodeValue(x.o, hexBytes(hex));
    return true;
  };
  try {
    bar.max = cand.length;
    for (let i = 0; i < cand.length; i += BATCH) {
      const part = cand.slice(i, i + BATCH);
      const r = await batchRead("g", part);
      part.forEach((x, k) => { const [st, hex] = r[k] || [0, ""]; if (!keep(x, st, hex) && x.o.k === "P") params.push(x); });
      bar.value = Math.min(cand.length, i + BATCH);
      deepMsg("deepP1", Math.min(cand.length, i + BATCH), cand.length, found.length);
    }
    bar.max = params.length || 1; bar.value = 0;
    for (let i = 0; i < params.length; i += BATCH) {
      const part = params.slice(i, i + BATCH);
      const show = (d) => { bar.value = i + d; deepMsg("deepP2", i + d, params.length, found.length); };
      show(0);
      const r = await batchRead("r", part, show);
      part.forEach((x, k) => { const [st, hex] = r[k] || [0, ""]; keep(x, st, hex); });
      show(part.length);
    }
    addExtras(found);
    deepMsg("deepDone", found.length);
  } catch (e) {
    addExtras(found);
    if (e.message === "stop") deepMsg("deepStopped", found.length);
    else deepMsg("deepErr", e.message === "no_link" ? t("errNoLink") : e.message === "timeout" ? t("errTimeout") : e.message);
  }
  deepRun = null;
  deepUi(false);
  render();
}
$("btn-deep").addEventListener("click", deepScan);
$("btn-deep-stop").addEventListener("click", () => { if (deepRun) deepRun.stop = true; });

// ---- start ----
(function init() {
  applyLang();
  $("presets").addEventListener("click", (e) => { const p = e.target.dataset.p; if (p) applyPreset(p); });
  const s = load("settings", null);
  if (s) { for (const k of ["devname", "friendly", "mac", "ref"]) if (s[k] !== undefined) $(k).value = s[k]; $("expected").checked = s.expected !== false; }
  rows = [];
  setRecords([], { article: 0, name: "" });
  pollScan(true);
})();
</script>
