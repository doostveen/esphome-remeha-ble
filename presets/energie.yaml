# Preset 'Energie' voor de remeha_confida-component (esphome-remeha-ble).
# Energietellers en draaiuren. Let op: niet elk toestel vult elke teller.
#
# Gebruik in je eigen YAML (naast de hub-configuratie):
#   packages:
#     energie: github://mcc-tweakers/esphome-remeha-ble/presets/energie.yaml@main
#
# Alle entiteiten gebruiken 'code:': naam, eenheid, schaal en type komen uit het
# codeboek in de component. Objecten die jouw toestel niet kent, worden in de log
# gemeld en daarna niet meer uitgelezen. Getest op een Confida 40.

sensor:
  - platform: remeha_confida
    code: AC088            # elektriciteit CV
  - platform: remeha_confida
    code: AC098            # warmte CV
  - platform: remeha_confida
    code: AC083            # seizoensrendement
  - platform: remeha_confida
    code: PC000            # productie-uren verwarming
  - platform: remeha_confida
    code: PC002            # aantal starts
  - platform: remeha_confida
    code: PC003            # branduren
