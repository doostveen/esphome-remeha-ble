# Preset 'Basis' voor de remeha_ble-component (esphome-remeha-ble).
# Kerngegevens van een Remeha-warmtepomp: temperaturen, status, vermogen en COP.
#
# Gebruik in je eigen YAML (naast de hub-configuratie):
#   packages:
#     basis: github://mcc-tweakers/esphome-remeha-ble/presets/basis.yaml@main
#
# Alle entiteiten gebruiken 'code:': naam, eenheid, schaal en type komen uit het
# codeboek in de component. Objecten die jouw toestel niet kent, worden in de log
# gemeld en daarna niet meer uitgelezen. Getest op een Confida 40.

sensor:
  - platform: remeha_ble
    code: HM001            # aanvoer warmtepomp
  - platform: remeha_ble
    code: HM002            # retour warmtepomp
  - platform: remeha_ble
    code: HM003            # setpunt aanvoer warmtepomp
  - platform: remeha_ble
    code: AM016            # aanvoer toestel
  - platform: remeha_ble
    code: AM027            # buitentemperatuur
  - platform: remeha_ble
    code: AM101            # intern aanvoersetpunt
  - platform: remeha_ble
    code: CM030            # ruimtetemperatuur
  - platform: remeha_ble
    code: AM019            # waterdruk
  - platform: remeha_ble
    code: AM056            # waterdebiet
  - platform: remeha_ble
    code: HM160            # thermisch vermogen
  - platform: remeha_ble
    code: HM161            # elektrisch vermogen
  - platform: remeha_ble
    code: HM031            # momentane COP

text_sensor:
  - platform: remeha_ble
    code: AM012            # status als tekst
  - platform: remeha_ble
    code: AM014            # substatus als tekst

binary_sensor:
  - platform: remeha_ble
    code: HM007            # in storing
  - platform: remeha_ble
    code: HM008            # compressor aan
  - platform: remeha_ble
    code: HM009            # ontdooien
  - platform: remeha_ble
    code: HM030            # vraag om compressorstart
  - platform: remeha_ble
    code: AM015            # pomp draait
