# Preset 'Ruimte' voor de remeha_confida-component (esphome-remeha-ble).
# Ruimtetemperaturen en gewenste temperatuur van de (actieve) groep.
#
# Gebruik in je eigen YAML (naast de hub-configuratie):
#   packages:
#     ruimte: github://mcc-tweakers/esphome-remeha-ble/presets/ruimte.yaml@main
#
# Alle entiteiten gebruiken 'code:': naam, eenheid, schaal en type komen uit het
# codeboek in de component. Objecten die jouw toestel niet kent, worden in de log
# gemeld en daarna niet meer uitgelezen. Getest op een Confida 40.

sensor:
  - platform: remeha_confida
    code: CM260            # ruimtetemperatuur hoge resolutie
  - platform: remeha_confida
    code: CM190            # gewenste ruimtetemperatuur
  - platform: remeha_confida
    code: CM280            # berekende gewenste ruimtetemperatuur
